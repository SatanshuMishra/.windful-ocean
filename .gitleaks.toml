[extend]
useDefault = true

[[allowlists]]
description = "Mitosis recorded-run runKey: content-derived 64-hex run identifier, not a credential"
condition = "AND"
paths = [
  '''\.claude/lib/mitosis/tests/evidence/''',
  '''\.claude/lib/mitosis/tests/cassettes/''',
]
regexTarget = "match"
regexes = [
  '''runKey"\s*:\s*"[0-9a-f]{64}"''',
]
