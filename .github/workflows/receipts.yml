name: receipts
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  receipts:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '26.x'

      - name: install pinned duckdb cli
        env:
          DUCKDB_VERSION: v1.5.5
          DUCKDB_SHA256: 08c0ca117111fcede14239d0093792352befdc174218c344d232c13279643d05
        run: |
          set -euo pipefail
          curl -sSLo duckdb.zip "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/duckdb_cli-linux-amd64.zip"
          echo "${DUCKDB_SHA256}  duckdb.zip" | sha256sum -c -
          unzip -o -q duckdb.zip -d "${RUNNER_TEMP}/duckdb"
          sudo install -m 0755 "${RUNNER_TEMP}/duckdb/duckdb" /usr/local/bin/duckdb
          rm -f duckdb.zip
          duckdb --version

      - uses: shaheershoaib/receipts/enforcer@c6127ba55f9a5669a95614639b08f5d49c3f228b

  mitosis-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        verb: [exec-allowlist, determinism, dispatchable-agent-schema-capable, name-integrity, phase-parity]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26.x'
      - name: ${{ matrix.verb }}
        run: |
          [ -f .claude/lib/mitosis/mitosis-gate.mjs ] \
            || { echo "the gate module is missing from the repository that owns it; a ${{ matrix.verb }} census that cannot find its own enforcement code fails rather than skipping"; exit 1; }
          node .claude/lib/mitosis/mitosis-gate.mjs ${{ matrix.verb }}

  repo-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26.x'
      - name: skill router lint (every router-form skill)
        run: |
          node scripts/repo/skill-router-lint.mjs \
            .claude/skills/platform-engineer \
            .claude/skills/conformance-auditor \
            .claude/skills/agent-audit
      - name: archive manifest consistency (byte correspondence is host-only)
        run: node scripts/repo/agent-ledger-archive-verify.mjs --manifest-only
      - name: agent body drift
        run: node --test .claude/lib/mitosis/tests/agent-body-composition.test.mjs

  pr-title-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - name: Conventional Commits PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          [ "${#PR_TITLE}" -le 72 ] \
            || { echo "PR title must be 72 characters or fewer (the squash commit subject)"; exit 1; }
          printf '%s' "$PR_TITLE" | grep -Eq '^(feat|fix|refactor|docs|test|chore|perf|ci)(\([a-z0-9][a-z0-9-]{0,15}\))?!?: [a-z].*[^ .]$' \
            || { echo "PR title must be Conventional Commits, lowercase imperative summary, no trailing period"; exit 1; }
