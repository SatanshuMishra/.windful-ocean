name: test

on:
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '26.x'
      - name: install pinned duckdb cli
        env:
          DUCKDB_VERSION: v1.5.5
          DUCKDB_SHA256: 08c0ca117111fcede14239d0093792352befdc174218c344d232c13279643d05
        run: |
          set -euo pipefail
          curl -sSLo duckdb.zip "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/duckdb_cli-linux-amd64.zip"
          echo "${DUCKDB_SHA256}  duckdb.zip" | sha256sum -c -
          unzip -o -q duckdb.zip -d "${RUNNER_TEMP}/duckdb"
          sudo install -m 0755 "${RUNNER_TEMP}/duckdb/duckdb" /usr/local/bin/duckdb
          rm -f duckdb.zip
          duckdb --version
      - run: npm test
      - run: node .claude/lib/mitosis/mitosis-gate.mjs phase-parity
